# Logrotate configuration for day-trader
# Install to /etc/logrotate.d/trader (or equivalent on your OS)
#
# Usage:
#   sudo cp deploy/logrotate-trader.conf /etc/logrotate.d/trader
#   sudo chown root:root /etc/logrotate.d/trader
#   sudo chmod 644 /etc/logrotate.d/trader

# Adjust path to your installation
/home/trader/day-trader/logs/trader.jsonl {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0644 trader trader
    
    # Don't rotate if empty
    minsize 1M
    
    # Optional: restart the service after rotation if using systemd
    # postrotate
    #     /bin/systemctl reload trader.service > /dev/null 2>&1 || true
    # endscript
}

/home/trader/day-trader/logs/dashboard.jsonl {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 trader trader
    minsize 100k
}
