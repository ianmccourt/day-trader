# Logrotate configuration for day-trader
# Install to /etc/logrotate.d/trader (or equivalent on your OS)
#
#   sudo cp deploy/logrotate-trader.conf /etc/logrotate.d/trader

/home/trader/day-trader/logs/trader.jsonl {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0644 trader trader
    minsize 1M
}

/home/trader/day-trader/logs/dashboard.jsonl {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 trader trader
    minsize 100k
}
