# Risk limits. Every order proposal is checked against every one of these
# before it can reach the broker; there is no path around them.
#
# Notional figures are USD. Counts are per rolling window.
# Unknown keys are a hard error at load time: a typo here must never silently
# disable a limit.

[limits]
# Per-symbol cap on the resulting position's absolute market value.
max_position_notional = 5000.0

# Portfolio-wide cap on the sum of absolute position market values.
max_total_exposure = 25000.0

# Trading halts for the rest of the trading day once equity has fallen this
# far below the prior close. The halt latches — an intraday recovery does not
# re-enable trading.
max_daily_loss = 2000.0

# Rolling-window order limits, counted from orders this harness submitted.
max_orders_per_hour = 6
max_orders_per_day = 20

[universe]
# Explicit allowlist. Nothing outside this list is tradeable, ever.
symbol_allowlist = [
    "AAPL",
    "MSFT",
    "NVDA",
    "SPY",
    "QQQ",
]

[session]
# Reject orders whenever the broker clock says the market is closed.
regular_trading_hours_only = true

# Reject any order that would open or increase a short position. Not in
# spec.MD's list; added because "sell 1000 of a 10-share position" is
# otherwise a naked short that only max_position_notional would catch.
allow_shorts = false
