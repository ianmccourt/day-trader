[project]
name = "day-trader"
version = "0.1.0"
description = "Agentic paper-trading harness (Alpaca paper API only)."
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33",
    "anthropic>=0.40",
    "apscheduler>=3.10,<4",
    "httpx>=0.28.1",
    "mcp>=1.9,<1.13",
]

[project.scripts]
trader = "trader.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.hatch.build.targets.wheel.force-include]
"src/trader/dashboard.html" = "trader/dashboard.html"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# BLE: SPEC.md forbids bare/blind excepts. Each remaining one carries a
# noqa with the reason it is deliberate.
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF", "BLE"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
