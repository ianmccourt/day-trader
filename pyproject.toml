[project]
name = "day-trader"
version = "0.1.0"
description = "Agentic paper-trading harness (Alpaca paper API only)."
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33",
    "anthropic>=0.40",
    "apscheduler>=3.10,<4",
]

[project.scripts]
trader = "trader.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
